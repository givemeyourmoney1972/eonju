<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px 24px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* 카테고리 필터 */
        .category-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .category-btn {
            border: 1px solid #e0e0e0;
            background-color: #fff;
            color: #555;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: #ff6b6b;
            color: #fff;
            border-color: #ff6b6b;
        }

        /* 메뉴 디스플레이 카드 */
        .menu-card {
            background-color: #fff5f5;
            border: 2px dashed #ff8e8e;
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 24px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .menu-name {
            font-size: 28px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .menu-tag {
            font-size: 13px;
            color: #888;
            background-color: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        /* 메인 버튼 */
        .recommend-btn {
            width: 100%;
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .recommend-btn:hover {
            background-color: #e84118;
        }

        .recommend-btn:active {
            transform: scale(0.98);
        }

        /* 메뉴 추가 영역 */
        .add-menu-section {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .add-menu-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #ff4757;
        }

        .input-group button {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .input-group button:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍱 오늘 뭐 먹지?</h1>
    <p class="subtitle">결정 장애를 해결해 주는 점심 메뉴 추천기</p>

    <!-- 카테고리 선택 -->
    <div class="category-group">
        <button class="category-btn active" onclick="setCategory('전체', this)">전체</button>
        <button class="category-btn" onclick="setCategory('한식', this)">한식</button>
        <button class="category-btn" onclick="setCategory('중식', this)">중식</button>
        <button class="category-btn" onclick="setCategory('일식', this)">일식</button>
        <button class="category-btn" onclick="setCategory('양식', this)">양식</button>
        <button class="category-btn" onclick="setCategory('분식', this)">분식</button>
    </div>

    <!-- 결과 출력 카드 -->
    <div class="menu-card">
        <div class="menu-name" id="menuName">버튼을 눌러주세요!</div>
        <div class="menu-tag" id="menuTag">카테고리</div>
    </div>

    <!-- 추천 버튼 -->
    <button class="recommend-btn" onclick="recommendMenu()">점심 메뉴 추천받기 🎲</button>

    <!-- 사용자 메뉴 추가 -->
    <div class="add-menu-section">
        <div class="add-menu-title">원하는 메뉴가 없나요? 직접 추가해보세요!</div>
        <div class="input-group">
            <input type="text" id="newMenuInput" placeholder="예: 제육볶음" onkeypress="if(event.keyCode==13) addMenu()">
            <button onclick="addMenu()">추가</button>
        </div>
    </div>
</div>

<script>
    // 기본 메뉴 데이터 목록
    let menuList = [
        { name: "김치찌개", category: "한식" },
        { name: "된장찌개", category: "한식" },
        { name: "제육볶음", category: "한식" },
        { name: "비빔밥", category: "한식" },
        { name: "국밥 (순대/돼지)", category: "한식" },
        { name: "짜장면", category: "중식" },
        { name: "짬뽕", category: "중식" },
        { name: "볶음밥", category: "중식" },
        { name: "마라탕", category: "중식" },
        { name: "돈가스", category: "일식" },
        { name: "초밥 (스시)", category: "일식" },
        { name: "라멘", category: "일식" },
        { name: "카레", category: "일식" },
        { name: "파스타", category: "양식" },
        { name: "수제버거", category: "양식" },
        { name: "피자", category: "양식" },
        { name: "떡볶이", category: "분식" },
        { name: "김밥 & 라면", category: "분식" }
    ];

    let currentCategory = "전체";
    let isRolling = false;

    // 카테고리 변경 함수
    function setCategory(category, element) {
        if (isRolling) return;
        
        currentCategory = category;
        
        // 버튼 스타일 처리
        const buttons = document.querySelectorAll('.category-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    // 메뉴 추천 함수 (스롯머신 연출 애니메이션 포함)
    function recommendMenu() {
        if (isRolling) return;

        // 선택된 카테고리에 맞는 메뉴 필터링
        const filteredList = currentCategory === "전체" 
            ? menuList 
            : menuList.filter(item => item.category === currentCategory);

        if (filteredList.length === 0) {
            alert("선택한 카테고리에 등록된 메뉴가 없습니다.");
            return;
        }

        isRolling = true;
        const menuNameEl = document.getElementById('menuName');
        const menuTagEl = document.getElementById('menuTag');

        let count = 0;
        const maxCount = 15; // 바퀴 수
        
        // 랜덤으로 바뀌는 타이머 애니메이션
        const interval = setInterval(() => {
            const tempRandom = Math.floor(Math.random() * filteredList.length);
            menuNameEl.innerText = filteredList[tempRandom].name;
            menuTagEl.innerText = filteredList[tempRandom].category;
            count++;

            if (count >= maxCount) {
                clearInterval(interval);
                // 최종 결정
                const finalResult = filteredList[Math.floor(Math.random() * filteredList.length)];
                menuNameEl.innerText = finalResult.name;
                menuTagEl.innerText = finalResult.category;
                isRolling = false;
            }
        }, 80);
    }

    // 신규 메뉴 추가 함수
    function addMenu() {
        const input = document.getElementById('newMenuInput');
        const name = input.value.trim();

        if (!name) {
            alert("메뉴 이름을 입력해주세요!");
            return;
        }

        // 현재 카테고리로 신규 메뉴 등록 (전체일 경우 한식으로 기본 지정)
        const category = currentCategory === "전체" ? "한식" : currentCategory;

        menuList.push({ name: name, category: category });
        alert(`'${name}'이(가) ${category} 메뉴 목록에 추가되었습니다!`);
        input.value = "";
    }
</script>

</body>
</html>
